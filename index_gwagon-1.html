<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mera Music</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#050505;color:#fff;min-height:100vh;overflow:hidden}
.bg{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.9)),url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Black_Mercedes-Benz_G_63_AMG_fl_London14.jpg") center/cover;filter:brightness(.55);z-index:-2}
.wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:28px 20px 34px;max-width:650px;margin:auto}
.brand{text-align:center;font-size:30px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 15px #000}
.card{background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px}
.title{text-align:center;font-size:21px;font-weight:700}.artist{text-align:center;color:#ccc;margin-top:7px}
video{width:100%;border-radius:16px;margin-top:18px;max-height:320px;background:#000}
.row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
button{border:0;color:#fff;background:rgba(255,255,255,.12);width:48px;height:48px;border-radius:50%;font-size:19px;cursor:pointer}
.play{background:#fff;color:#111;width:60px;height:60px;font-size:24px}
input[type=range]{width:100%;accent-color:#fff}.time{display:flex;justify-content:space-between;color:#bbb;font-size:12px;margin-top:7px}
.playlist{display:flex;gap:10px;margin-top:18px}.track{flex:1;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:11px 8px;text-align:center;cursor:pointer;font-size:13px}.track.active{background:rgba(255,255,255,.2)}
.signature{position:fixed;right:14px;bottom:12px;font-size:13px;color:#ddd;text-shadow:0 1px 5px #000}
@media(max-width:420px){.wrap{padding:22px 14px 24px}.brand{font-size:26px}.card{padding:16px}video{max-height:260px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="brand">MERA MUSIC 🎵</div>
<div class="card">
<div class="title" id="title">Talwiinder Song 1</div>
<div class="artist">Talwiinder</div>
<video id="player" playsinline preload="metadata"></video>
<input id="progress" type="range" min="0" max="100" value="0">
<div class="time"><span id="current">0:00</span><span id="duration">0:00</span></div>
<div class="row"><button id="prev">⏮</button><button class="play" id="play">▶</button><button id="next">⏭</button></div>
<div class="playlist"><button class="track active" data-i="0">🎵 Song 1</button><button class="track" data-i="1">🎵 Song 2</button></div>
</div>
</div>
<div class="signature">Shilu 🫥</div>
<script>
const songs=[{name:"Talwiinder Song 1",src:"songs/song1.mp4"},{name:"Talwiinder Song 2",src:"songs/song2.mp4"}];
let i=0;const v=document.getElementById("player"),title=document.getElementById("title"),play=document.getElementById("play"),progress=document.getElementById("progress");
function load(n,autoplay=false){i=(n+songs.length)%songs.length;v.src=songs[i].src;title.textContent=songs[i].name;document.querySelectorAll(".track").forEach((x,k)=>x.classList.toggle("active",k===i));if(autoplay)v.play().catch(()=>{})}
function fmt(s){return isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00"}
play.onclick=()=>{if(v.paused)v.play();else v.pause()}
document.getElementById("prev").onclick=()=>load(i-1,true);document.getElementById("next").onclick=()=>load(i+1,true);
document.querySelectorAll(".track").forEach(x=>x.onclick=()=>load(+x.dataset.i,true));
v.addEventListener("timeupdate",()=>{progress.value=v.duration?v.currentTime/v.duration*100:0;document.getElementById("current").textContent=fmt(v.currentTime)});
v.addEventListener("loadedmetadata",()=>document.getElementById("duration").textContent=fmt(v.duration));
v.addEventListener("play",()=>play.textContent="⏸");v.addEventListener("pause",()=>play.textContent="▶");v.addEventListener("ended",()=>load(i+1,true));
progress.oninput=()=>{if(v.duration)v.currentTime=progress.value/100*v.duration};load(0);
</script>
</body>
</html>
